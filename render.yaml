services:
  - type: web
    name: brugwachter-live
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: REFRESH_INTERVAL_MS
        value: "300000"
      - key: REFRESH_SECRET
        generateValue: true
