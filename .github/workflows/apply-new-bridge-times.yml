name: Apply new bridge times

on:
  push:
    paths:
      - ".github/workflows/apply-new-bridge-times.yml"

permissions:
  contents: write

jobs:
  patch-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update Botlekbrug and Spijkenisserbrug schedule text
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("server.mjs")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  '    scheduleText: "Vaste mogelijkheden om :15 en :45. Op werkdagen niet voor pleziervaart tijdens 06:30–09:30 en 15:30–18:30.",\n    professionalText: "Voor beroepsvaart kunnen andere voorwaarden gelden.",',
                  '    showNightPassage: false,\n    scheduleText: "Ma–vr pleziervaart: 00:00–06:30, 09:30–15:30 en 18:30–24:00. Tussen 06:00–22:00 bediening om :15 en :45.",\n    professionalText: "Beroepsvaart 24 uur per dag.",'
              ),
              (
                  '    scheduleText: "Vaste mogelijkheid op het halve uur. Op werkdagen niet voor pleziervaart tijdens 06:30–09:30 en 15:30–18:30.",\n    professionalText: "Voor beroepsvaart kunnen andere voorwaarden gelden.",',
                  '    showNightPassage: false,\n    scheduleText: "Ma–vr pleziervaart elk uur op het halve uur; bedienvensters 00:00–06:30, 09:30–15:30 en 18:30–24:00. Za/zo/feest: elk uur op het halve uur.",\n    professionalText: "Beroepsvaart 24 uur per dag.",'
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"Expected text not found: {old}")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Validate diff
        run: git diff --check

      - name: Commit update
        shell: bash
        run: |
          git config user.name "brugopen-auto"
          git config user.email "actions@users.noreply.github.com"
          git add server.mjs
          git commit -m "Werk bedientijden Botlekbrug en Spijkenisserbrug bij"
          git push
