name: Apply 2026 bridge schedule update

on:
  push:
    paths:
      - '.github/workflows/apply-2026-bridge-schedule-update.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch bridge schedules
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('server.mjs')
          s = p.read_text(encoding='utf-8')

          s = s.replace('id: "spijkenisserbrug",\n    windAlertAboveBft: 8,', 'id: "spijkenisserbrug",\n    windAlertAboveBft: 9,')
          s = s.replace('id: "papendrechtsebrug",\n    windAlertAboveBft: 6,', 'id: "papendrechtsebrug",\n    windAlertAboveBft: 5,')
          s = s.replace('id: "hartelbrug",\n    windAlertAboveBft: 7,', 'id: "hartelbrug",\n    windAlertAboveBft: 6,')
          s = s.replace("v.bft>=b.windAlertAboveBft", "v.bft>b.windAlertAboveBft")
          s = s.replace("' Bft heeft de bedieningsgrens van '+b.windAlertAboveBft+' Bft bereikt'", "' Bft is hoger dan de bedieningsgrens van '+b.windAlertAboveBft+' Bft'")

          s = s.replace('scheduleText: "Ma–vr pleziervaart: 00:00–06:30, 09:30–15:30 en 18:30–24:00. Tussen 06:00–22:00 bediening om :15 en :45.",', 'scheduleText: "Ma–vr pleziervaart: 00:00–06:30, 09:30–15:30 en 18:30–24:00. Vaste openingen tussen 06:00–22:00 om :15 en :45.",')
          s = s.replace('scheduleText: "Zomerregeling met vaste pleziervaartmomenten; de twee eerstvolgende worden hierboven getoond.",\n    professionalText: "Beroepsvaart kan extra of afwijkende bediening hebben.",', 'scheduleText: "1 apr–31 okt: ma–vr 10:00, 11:00, 12:00, 13:00, 14:00, 16:00 en 18:15; 19:00–07:15 bij aanbod. Za/zo/feest 09:00, 10:00, 11:00, 12:00, 13:00, 14:00, 16:00 en 18:00; 1 jun–30 sep ook 15:00; 19:00–07:15 bij aanbod. 1 nov–31 mrt bij aanbod.",\n    professionalText: "Ma–vr 1 apr–31 okt ook 09:15 uitsluitend beroepsvaart. In winter bij aanbod; ma–vr niet tussen 07:15–09:15 en 16:00–18:15.",')
          s = s.replace('scheduleText: "24 uur op afroep, minimaal 2 uur vooraf. Werkdagen niet tijdens 06:45–08:30 en 16:00–18:30.",\n    professionalText: "Dezelfde afroepregeling; geen afzonderlijke tweede mogelijkheid weergegeven.",', 'scheduleText: "Ma–vr bediening 00:00–06:45, 08:30–16:00 en 18:30–24:00. Za/zo/feest 00:00–24:00.",\n    professionalText: "Volgens de regeling vanaf 4 mei 2026 gelden dezelfde bedienvensters.",')
          s = s.replace('scheduleText: "Zomer: werkdagen 09:30–15:30 en 18:30–22:00; weekend 09:30–22:00. Bij aanvraag of aanbod.",', 'scheduleText: "1 apr–31 okt: ma–vr 09:30–15:30 en 18:30–22:00; za/zo/feest 09:30–22:00. 1 nov–31 mrt: ma–vr 09:30–15:30 en 18:30–19:30; za/zo/feest 09:30–17:00. Geen bediening 25 en 26 december en 1 januari.",')

          s = s.replace('audienceLabel: "Geen pleziervaart",\n    showNightPassage: false,\n    displayMode: "notice",\n    timingTitle: "Pleziervaart",\n    timingMain: "Geen bediening",\n    timingSub: "De Van Brienenoordbrug wordt niet geopend voor pleziervaart",\n    scheduleText: "Geen bediening voor pleziervaart.",\n    professionalText: "Op afroep 11:00–11:10, 14:00–14:10 en 19:30–19:40. Nacht 00:00–06:00 alleen na minimaal 12 uur vooraf aanvragen en goedkeuring; tussen 21:00–06:00 minimaal 1 uur tussen openingen.",', 'audienceLabel: "Bediening op aanvraag",\n    showNightPassage: false,\n    displayMode: "schedule",\n    timingTitle: "Bediening op aanvraag",\n    timingMain: "11:00 · 14:00 · 19:30",\n    timingSub: "Aanvraag minimaal 12 uur vooraf",\n    scheduleText: "Alle dagen 11:00, 14:00 en 19:30 op aanvraag, minimaal 12 uur vooraf. Tussen 21:00–06:00 eveneens op aanvraag. Niet voor zeilschepen / bruine vloot.",\n    professionalText: "Aanvragen minimaal 12 uur vooraf via vc-zwm-brienenoordbrug@rws.nl.",')

          s = s.replace('audienceLabel: "Geen pleziervaart",\n    showNightPassage: false,\n    displayMode: "notice",\n    timingTitle: "Pleziervaart",\n    timingMain: "Geen bediening",\n    timingSub: "De Calandbrug wordt niet geopend voor pleziervaart",\n    scheduleText: "Geen bediening voor pleziervaart.",', 'audienceLabel: "24 uur bediening",\n    showNightPassage: false,\n    displayMode: "schedule",\n    timingTitle: "Bediening",\n    timingMain: "24 uur per dag",\n    timingSub: "Dagelijks",\n    scheduleText: "Dagelijks 24 uur per dag.",')

          s = s.replace('scheduleText: "Geen reguliere bediening tijdens de renovatie. Lage scheepvaart kan onder het vaste deel door, behalve tijdens afzonderlijk gemelde stremmingen.",', 'scheduleText: "Tijdelijke renovatieregeling heeft voorrang. Basisregeling: ma–vr 09:35 t/m 15:35 elk uur en 18:35; 06:35 en 08:50 alleen beroepsvaart; 19:35–06:00 bij aanbod. Za/zo/feest 08:50, 09:35 t/m 16:35 elk uur, 18:35 en 19:35–07:35 bij aanbod; 1 jul–31 aug ook 17:35.",')

          s = s.replace('const total = hour * 60 + minute;\n\n      if (!weekend) {', 'const total = hour * 60 + minute;\n\n      if (total < 6 * 60 || total >= 22 * 60) continue;\n\n      if (!weekend) {', 1)

          s = re.sub(r'function alblasserdamTimes\(localDate\) \{.*?\n\}', '''function alblasserdamTimes(localDate) {
  const inSummerSchedule = localDate.month >= 4 && localDate.month <= 10;
  if (!inSummerSchedule) return [];
  const weekend = isWeekendOrHoliday(localDate);
  if (!weekend) return [[10, 0], [11, 0], [12, 0], [13, 0], [14, 0], [16, 0], [18, 15]];
  const values = [[9, 0], [10, 0], [11, 0], [12, 0], [13, 0], [14, 0], [16, 0], [18, 0]];
  if (localDate.month >= 6 && localDate.month <= 9) values.push([15, 0]);
  values.sort((a, b) => (a[0] * 60 + a[1]) - (b[0] * 60 + b[1]));
  return values;
}''', s, count=1, flags=re.S)

          s = re.sub(r'function gorinchemTimes\(localDate\) \{.*?\n\}', '''function gorinchemTimes(localDate) {
  const weekend = isWeekendOrHoliday(localDate);
  const values = [[11, 0], [13, 0]];
  if (localDate.month === 7 || localDate.month === 8) values.push([14, 0]);
  if (!weekend) values.push([20, 0]);
  values.sort((a, b) => (a[0] * 60 + a[1]) - (b[0] * 60 + b[1]));
  return values;
}

function brienenoordTimes(localDate) {
  return [[11, 0], [14, 0], [19, 30]];
}

function wantijWindows(localDate) {
  const key = dateKey(localDate);
  if (key.endsWith('-01-01') || key.endsWith('-12-25') || key.endsWith('-12-26')) return [];
  const weekend = isWeekendOrHoliday(localDate);
  const summer = localDate.month >= 4 && localDate.month <= 10;
  if (summer) return weekend ? [[9, 30, 22, 0]] : [[9, 30, 15, 30], [18, 30, 22, 0]];
  return weekend ? [[9, 30, 17, 0]] : [[9, 30, 15, 30], [18, 30, 19, 30]];
}''', s, count=1, flags=re.S)

          s = re.sub(r'function hartelOpportunity\(now\) \{.*?\n\}', '''function hartelOpportunity(now) {
  const result = nextWindowOpportunity(now, (localDate) => {
    if (isWeekendOrHoliday(localDate)) return [[0, 0, 23, 59]];
    return [[0, 0, 6, 45], [8, 30, 16, 0], [18, 30, 23, 59]];
  }, "Nu binnen bedientijd");
  return result || { instant: null, nowPossible: false, label: "Geen bedientijd gevonden" };
}''', s, count=1, flags=re.S)

          s = s.replace('if (bridge.scheduleType === "brienenoord") {\n    return { instant: null, label: "Pleziervaart: minimaal 12 uur vooraf aanvragen", state: "request" };\n  }', 'if (bridge.scheduleType === "brienenoord") {\n    const instant = futureCandidates(now, brienenoordTimes)[0] ?? null;\n    return { instant, label: "Op aanvraag · minimaal 12 uur vooraf", state: "request" };\n  }')
          s = s.replace('if (bridge.scheduleType === "brienenoord") {\n    return {\n      first: null,\n      following: null,\n      followingText: "Na aanvraag en goedkeuring",\n      label: "Minimaal 12 uur vooraf aanvragen",\n      state: "request"\n    };\n  }', 'if (bridge.scheduleType === "brienenoord") {\n    const values = futureCandidates(now, brienenoordTimes);\n    return {\n      first: values[0] ?? null,\n      following: values[1] ?? null,\n      followingText: "Nacht 21:00–06:00 ook op aanvraag",\n      label: "Op aanvraag · minimaal 12 uur vooraf",\n      state: "request"\n    };\n  }')

          s = re.sub(r'nextWindowOpportunity\(now, \(localDate\) => \{\n      const weekend = isWeekendOrHoliday\(localDate\);\n      return weekend\n        \? \[\[9, 30, 22, 0\]\]\n        : \[\[9, 30, 15, 30\], \[18, 30, 22, 0\]\];\n    \}, "Nu mogelijk bij aanvraag/aanbod"\)', 'nextWindowOpportunity(now, wantijWindows, "Nu mogelijk bij aanvraag/aanbod")', s, count=1)
          s = re.sub(r'windowOpportunityList\(now, \(localDate\) => \{\n      const weekend = isWeekendOrHoliday\(localDate\);.*?\n    \}\)', 'windowOpportunityList(now, wantijWindows)', s, count=1, flags=re.S)

          s = re.sub(r'(id: "merwedebrug-gorinchem",.*?scheduleText: )"[^"]*"', r'\1"Ma–vr 11:00, 13:00 en 20:00; 22:00–04:30 bij aanbod. Za/zo/feest 11:00 en 13:00; 20:00–08:00 bij aanbod. 1 jul–31 aug ook 14:00."', s, count=1, flags=re.S)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Validate JavaScript syntax
        run: node --check server.mjs
      - name: Commit updated schedules
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "brugopen-auto"
          git config user.email "actions@users.noreply.github.com"
          git add server.mjs
          git commit -m "Align bridge schedules with 4 May 2026 document"
          git push
